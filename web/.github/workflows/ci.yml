# NeMo RL Web Configurator CI/CD Pipeline
name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'

jobs:
  # Frontend CI
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
      
      - name: Type check
        run: npm run typecheck || echo "Typecheck skipped"
      
      - name: Build
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/frontend/dist

  # Backend CI
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt
      
      - name: Lint with ruff
        run: ruff check . || echo "Linting skipped"
      
      - name: Type check with mypy
        run: mypy main.py --ignore-missing-imports || echo "Type check skipped"
      
      - name: Run tests
        run: pytest tests/ -v --tb=short
      
      - name: Run tests with coverage
        run: pytest tests/ --cov=. --cov-report=xml --cov-report=html
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: web/backend/htmlcov

  # Integration tests (requires both frontend and backend)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd web/frontend && npm ci
          cd ../backend && pip install -r requirements.txt
      
      - name: Start backend
        run: |
          cd web/backend
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
      
      - name: Health check
        run: curl -f http://localhost:8000/api/v1/health
